<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Dot Dash</title>
<link rel="manifest" href="/c/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dot Dash">
<!-- The browser chrome follows the ground in each theme. The manifest cannot
     be media-queried, so its background_color/theme_color is the light value;
     it is also read once at install, so an existing Home Screen app keeps the
     old splash colour until it is removed and re-added. -->
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<!--
  The chat page for web-link contacts: https://dotdashdevice.com/c/<token>.
  Talks only to /chat/api/ (bridge/sms/service.mjs, chatApi). No account: each
  link is a credential, and the first device to Connect claims it.

  First visit to a link: an opt-in screen offering SMS notifications (the
  contact types their own number and ticks an unticked consent box -- the only
  way any number gets an SMS from Dot Dash), then the chat. SMS only ever says
  a message is waiting and links back here; it never carries message content.
  Someone with the Dot Dash app installed never sees this page: the link opens
  the app's Connect mode, which uses app notifications instead.

  One page holds every chat this device has connected (an inbox when there is
  more than one). On iPhone, a Home Screen web app has its own storage,
  separate from Safari's, and links always open in Safari -- so a second link
  reaches an existing Home Screen app by "Copy link" in Safari and "Add a chat"
  in the app.
  Deployed by hand to /var/www/dotdashdevice/c/ (nginx serves this file for
  every /c/ path, with access logging off so tokens never reach a log).
-->
<style>
  /* ---- Faces. The same three files site/index.html and /faq serve, from our
          own origin -- a font CDN would make every page view a request to a
          third party carrying the visitor's IP, which the privacy policy says
          we don't do. site/fonts/README.md has the sources and licences.
          This page is hand-deployed, so the files must already be at
          /var/www/dotdashdevice/fonts/ for these to resolve. ---- */
  @font-face {
    font-family:"Atkinson Hyperlegible Next"; font-style:normal;
    font-weight:400 700;            /* one variable file covers the whole range */
    font-display:swap;
    src:url("/fonts/AtkinsonHyperlegibleNext-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
                  U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
                  U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face {
    /* Contact names are typed by the account holder, so this subset is not
       padding: without it a name with a Polish or Turkish letter renders half
       in Atkinson and half in the system face. */
    font-family:"Atkinson Hyperlegible Next"; font-style:normal;
    font-weight:400 700; font-display:swap;
    src:url("/fonts/AtkinsonHyperlegibleNext-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,
                  U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face {
    font-family:"Departure Mono"; font-style:normal; font-weight:400;
    font-display:swap;
    src:url("/fonts/DepartureMono-Regular.woff2") format("woff2");
  }

  /* ---- Tokens. The same names and the same values as the :root blocks in
          site/index.html, site/faq/index.html and app/src/index.css. If a
          value changes in one it changes in all four; that is the whole point
          of them having one set of names. brand/DESIGN-BRIEF.md section 6.

          This page is where the old palette hurt most: it is the first Dot
          Dash thing most people ever see, they did not ask to see it, and its
          audience skews oldest. Every number in these comments was measured,
          not asserted. ---- */
  :root {
    color-scheme: light dark;
    --bg:#f6f5f3; --card:#ffffff; --ink:#1b1a18; --muted:#55514b; --rule:#d8d3cb;
    --accent:#2563eb;        /* 5.17:1 on --card, 4.74:1 on --bg */
    --accent-ink:#ffffff;    /* 5.17:1 on the accent fill */
    --accent-soft:rgba(37,99,235,.16);
    --screen-edge:#1b1a18;

    /* Recessed row inside a card: ink 14.88:1, muted 6.74:1 */
    --sunken:#efedea;

    /* The bubbles. Outgoing was white on #3b82f6 at 3.68:1 -- the worst
       contrast in the whole system, on the words a grandmother opened this
       link to read. These are ROLE NAMES over the accent rather than new
       colours, and that is the decision, not laziness. A second filled blue
       was drawn and measured first (#1d4ed8, white on it 6.70:1, half a grade
       better) and rejected: it would put two blues on one screen, which is the
       exact fault the brief diagnoses in the system today. One filled blue per
       theme is worth more than 1.5 points of contrast on an element that
       already passes AA. Do not "improve" this back.
         light  #2563eb with #ffffff   5.17:1   (was 3.68:1)
         dark   #93c5fd with #0b1220  10.38:1
       The dark sibling being the pale one is the right way round: a bubble is
       a fill, so its ink darkens as the fill lightens, and the shape then
       separates from the card instead of sinking into it. */
    --sent:var(--accent); --sent-ink:var(--accent-ink);
    --recv:var(--card); --recv-ink:var(--ink);   /* 17.39:1 light, 14.44:1 dark */

    /* State. Each is a pair for the same reason the accent is. */
    --ok:#15803d;
    --warn:#8a5300;          /* 6.33:1 on --card, 5.81:1 on --bg */
    --danger:#b42318;        /* 6.57:1 on --card */
    --alert:#b42318; --alert-ink:#ffffff;

    /* The device screen. The only two values here with NO dark sibling: the
       panel is unlit and the pixels are lit, at midnight and at noon, so
       theming it would be a lie about the hardware. 17.12:1. */
    --screen:#0e0e0e; --screen-ink:#eef2f2;

    --r-card:20px; --r-control:12px; --r-bubble:18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#131211; --card:#1c1b19; --ink:#ecebe8; --muted:#a8a39b; --rule:#3a3733;
      --accent:#93c5fd;      /* 9.54:1 on --card, 10.38:1 on --bg */
      --accent-ink:#0b1220;
      --accent-soft:rgba(147,197,253,.20);
      --screen-edge:#494540;
      --sunken:#26241f;
      /* --sent / --recv are not redefined: they alias --accent and --card,
         which are already pairs, so they follow. */
      --ok:#1f9d52;
      --warn:#fbbf24;        /* 10.31:1 on --card */
      --danger:#fca5a5;      /* 9.07:1 on --card */
      --alert:#c1352a; --alert-ink:#ffffff;   /* white 5.51:1, 3.12:1 on --card */
    }
  }

  * { box-sizing: border-box; }
  html, body { height:100%; }
  /* Atkinson Hyperlegible Next, drawn for distinction between confusable
     characters. The whole reason it is the brand's face is the two readers who
     land on this URL: a seven-year-old and a grandparent. 17px matches the
     site; nothing on this page is below 13px. */
  body { margin:0; background:var(--bg); color:var(--ink);
         font:400 17px/1.55 "Atkinson Hyperlegible Next",ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
         -webkit-text-size-adjust:100%; }
  .screen { max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .center { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:32px 0; }
  /* The mark is line art in currentColor, not the old opaque icon.png: that
     file has no alpha channel and cannot sit on this page's dark ground at
     all. Drawn on a 48-unit grid and shown at 96px -- 2 units per CSS pixel,
     so every edge lands on a whole device pixel at 1x, 2x and 3x (72px would
     be 1.5 and fringe). brand/marks/README.md. */
  .logo { display:block; width:96px; height:96px; margin:0 auto 16px; color:var(--ink); }
  h1 { font-size:26px; line-height:1.2; margin:0 0 10px; font-weight:700; }
  p { margin:0 0 12px; color:var(--muted); }
  a { color:var(--accent); }
  /* A visible keyboard focus ring on everything. The page had none. */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .btn { display:block; width:100%; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:700; padding:14px; border-radius:var(--r-control); cursor:pointer; }
  .btn:disabled { background:var(--rule); border-color:var(--rule); color:var(--muted); cursor:default; }
  .btn.ghost { background:var(--card); color:var(--accent); border:1px solid var(--rule); }
  .small { font-size:15px; }

  header { position:sticky; top:0; background:var(--bg); padding:12px 0 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--rule); z-index:1; }
  header .mark { width:48px; height:48px; flex-shrink:0; color:var(--ink); }
  header .who { font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #log { flex:1; padding:14px 0; display:flex; flex-direction:column; gap:8px; }
  .b { max-width:82%; padding:10px 14px; border-radius:var(--r-bubble); word-wrap:break-word; white-space:pre-wrap; }
  .b.me { align-self:flex-end; background:var(--sent); color:var(--sent-ink); border-bottom-right-radius:6px; }
  /* Incoming -- what the Dot Dash said -- gets the best numbers on the page.
     The hairline is what separates it from the ground in dark mode, exactly as
     cards are separated on site/index.html. */
  .b.them { align-self:flex-start; background:var(--recv); color:var(--recv-ink); border:1px solid var(--rule); border-bottom-left-radius:6px; }
  .when { font-size:13px; color:var(--muted); align-self:center; margin-top:6px; }
  .empty { text-align:center; color:var(--muted); margin:auto 0; }

  .notice { background:var(--card); border:1px solid var(--rule); border-radius:var(--r-card); padding:12px 14px; margin:10px 0 0; font-size:16px; color:var(--muted); }
  .notice b { color:var(--ink); }

  footer.compose { position:sticky; bottom:0; background:var(--bg); padding:10px 0 12px; border-top:1px solid var(--rule); }
  .row { display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; font:inherit; padding:11px 13px; border-radius:16px; border:1px solid var(--rule); background:var(--card); color:var(--ink); max-height:120px; }
  textarea::placeholder { color:var(--muted); opacity:1; }
  .send { width:auto; padding:11px 18px; }

  /* The send preview is the one reserved use of the pixel face: a picture of
     what the 128x32 panel will show, in its own uppercase, on the unlit panel
     colour with a --screen-edge hairline so the rectangle does not vanish on
     the dark ground. Wrapped, never truncated -- cutting it short would hide
     the part being checked. */
  .preview { font-size:13px; color:var(--muted); margin:6px 4px 0; min-height:18px; }
  .preview .warn { color:var(--warn); display:block; margin-top:4px; }
  .pix { display:block; margin-top:4px; padding:5px 8px; border-radius:3px;
         background:var(--screen); color:var(--screen-ink); border:1px solid var(--screen-edge);
         font:400 12px/1.35 "Departure Mono",ui-monospace,"SF Mono",Menlo,monospace;
         text-transform:uppercase; word-break:break-word; }
  /* A 4:1 rectangle, because the panel is 128x32. Shown once, on the landing
     screen, as the answer to "what have I opened". */
  .pix.panel { display:flex; flex-direction:column; align-items:center; justify-content:center;
               width:232px; max-width:100%; aspect-ratio:4/1; margin:4px auto 0; padding:0; }
  .pix.panel .t { font-size:9px; letter-spacing:.14em; opacity:.7; }
  .pix.panel .m { font-size:15px; }

  .links { font-size:15px; color:var(--muted); text-align:center; margin:14px 0 4px; }
  .links a, .links button { color:var(--accent); background:none; border:0; font:inherit; text-decoration:underline; cursor:pointer; padding:0 6px; }
  .hbtn { background:none; border:0; color:var(--accent); font:inherit; font-weight:700; cursor:pointer; padding:4px 6px; }
  .back { font-size:26px; line-height:1; padding:0 8px 0 0; }

  .ios { margin:22px 0 4px; text-align:center; }
  .ios p { font-size:15px; margin:0 0 10px; }
  .ios button { background:none; border:0; padding:0; cursor:pointer; line-height:0; }
  .ios img { height:54px; width:auto; display:block; }
  .steps { text-align:left; max-width:380px; margin:22px auto 0; }
  .steps div { display:flex; gap:12px; margin-bottom:16px; }
  .steps .n { flex:0 0 30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:700; display:flex; align-items:center; justify-content:center; }
  .steps p { margin:4px 0 0; color:var(--ink); }
  .url { font-size:13px; color:var(--muted); word-break:break-all; margin-top:14px; }

  /* The reassurance, as part of the design rather than two lines of pale grey
     under the button. An unexpected link asking for a phone number is a
     suspicious object, so this sits ABOVE the action and leads each line with
     the load-bearing half in ink. */
  .facts { text-align:left; background:var(--card); border:1px solid var(--rule); border-radius:var(--r-card); margin:14px 0; overflow:hidden; }
  .facts div { padding:12px 14px; font-size:16px; color:var(--muted); }
  .facts div + div { border-top:1px solid var(--rule); }
  .facts b { color:var(--ink); }

  .list { padding:6px 0; }
  .chatrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:12px; margin:8px 0; font:inherit; color:inherit; cursor:pointer; }
  .chatrow .mark { width:48px; height:48px; flex-shrink:0; color:var(--ink); }
  .chatrow .mid { flex:1; min-width:0; }
  .chatrow .name { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chatrow .last { color:var(--muted); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chatrow .time { color:var(--muted); font-size:13px; flex-shrink:0; }
  /* Unread. Colour is a second channel only -- the aria-label is the first. */
  .dot { width:10px; height:10px; border-radius:50%; background:var(--alert); flex-shrink:0; }

  input.field { width:100%; font:inherit; padding:12px; border-radius:var(--r-control); border:1px solid var(--rule); background:var(--card); color:var(--ink); margin:6px 0 10px; }
  input.field::placeholder { color:var(--muted); opacity:1; }
  .optin { text-align:left; background:var(--card); border:1px solid var(--rule); border-radius:var(--r-card); padding:16px; margin:6px 0 14px; }
  .optin h2 { font-size:19px; margin:0 0 6px; font-weight:700; }
  /* Restyled only. The consent wording below it is compliance text for the
     toll-free verification and is not editorial copy -- do not reword it. */
  .consent { display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--muted); margin:4px 0 14px; cursor:pointer; }
  .consent input { width:22px; height:22px; flex-shrink:0; margin:1px 0 0; accent-color:var(--accent); }
  .consent b { color:var(--ink); }
  .err { color:var(--danger); font-size:15px; min-height:18px; margin:-6px 0 10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="screen" id="app"><div class="center"><p>Loading…</p></div></div>

<script>
(function () {
  var API = '/chat/api/';
  var STORE = 'dotdash_chats';
  var MAX = 160;
  var TOKEN_RE = /^[A-Za-z0-9_-]{32}$/;
  var app = document.getElementById('app');

  // ---------------------------------------------------------------- storage --
  // Every chat this device has connected: { token, claim, id, displayName,
  // contactName, lastAt, lastText, lastFrom, readAt, ended }.
  var chats = (function () {
    try { return (JSON.parse(localStorage.getItem(STORE) || '[]') || []).filter(function (c) { return c && TOKEN_RE.test(c.token || ''); }); }
    catch (e) { return []; }
  })();
  function persist() { try { localStorage.setItem(STORE, JSON.stringify(chats)); } catch (e) {} }
  function byToken(t) { for (var i = 0; i < chats.length; i++) if (chats[i].token === t) return chats[i]; return null; }
  function byId(id) { for (var i = 0; i < chats.length; i++) if (chats[i].id === id) return chats[i]; return null; }
  function upsert(c) {
    var e = byToken(c.token);
    if (e) { for (var k in c) e[k] = c[k]; } else { e = c; chats.push(e); }
    persist();
    return e;
  }
  function drop(token) {
    chats = chats.filter(function (c) { return c.token !== token; });
    persist();
    delete msgs[token];
    polls[token] = false;
  }
  function live() { return chats.filter(function (c) { return c.claim && !c.ended; }); }

  var msgs = {};       // token -> messages loaded this session
  var aborts = {};     // token -> AbortController of its running wait
  var polls = {};      // token -> true while its long poll runs
  var leaving = {};    // token -> true once Leave/Move was tapped
  var current = null;  // token of the open chat
  var view = 'boot';   // chat | inbox | other

  function authOf(c) { return c.token + '.' + c.claim; }
  function call(method, route, body, auth, signal) {
    var h = { 'Content-Type': 'application/json' };
    if (auth) h.Authorization = 'Chat ' + auth;
    return fetch(API + route, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, signal: signal })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { b._status = r.status; return b; }); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function show(html) { app.innerHTML = html; }

  // ------------------------------------------------------------------ mark --
  // The Dot Dash mark as pixels, from brand/marks (smile.py): the enclosure
  // outline as the frame, the round SELECT cap as the dot, the screen window
  // as a true rectangle for the dash, and the engraved smile. Inline SVG in
  // currentColor, so one drawing serves both themes -- icon.png is an opaque
  // photograph with no alpha and cannot sit on this page's dark ground.
  // icon.png itself is untouched and is still the favicon, the Home Screen
  // icon and the manifest's icons.
  // Each entry is [x, y, w, h] in grid units. Draw a grid only at a whole
  // multiple of its own size: 48 at 96px, 24 at 48px.
  var GRIDS = {
    48: [[6,10,36,1],[5,11,38,1],[4,12,2,1],[42,12,2,1],[3,13,2,1],[43,13,2,1],
         [2,14,2,19],[44,14,2,19],[13,19,3,1],[12,20,5,1],[26,20,12,5],[11,21,7,3],
         [12,24,5,1],[13,25,3,1],[22,30,1,1],[25,30,1,1],[23,31,2,1],[3,33,2,1],
         [43,33,2,1],[4,34,2,1],[42,34,2,1],[5,35,38,1],[6,36,36,1]],
    24: [[3,5,18,1],[2,6,1,1],[21,6,1,1],[1,7,1,9],[22,7,1,9],[7,10,2,1],[6,11,4,2],
         [13,11,6,2],[7,13,2,1],[10,15,4,1],[2,16,1,1],[21,16,1,1],[3,17,18,1]]
  };
  function mark(grid, cls, label) {
    var r = GRIDS[grid], out = '', i;
    for (i = 0; i < r.length; i++) out += '<rect x="' + r[i][0] + '" y="' + r[i][1] + '" width="' + r[i][2] + '" height="' + r[i][3] + '"/>';
    return '<svg class="' + cls + '" viewBox="0 0 ' + grid + ' ' + grid + '" shape-rendering="crispEdges" fill="currentColor"' +
      (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + '>' + out + '</svg>';
  }
  function logo() { return mark(48, 'logo', 'Dot Dash'); }

  // One sentence, in the house voice, for a stranger who tapped a link in a
  // message and does not know what they have opened. The same words as the
  // iOS app's contact mode (app/src/ContactApp.jsx, WHAT_IT_IS) -- the two
  // surfaces describe the same product to the same person and must not drift.
  var WHAT_IT_IS = 'A Dot Dash is a small messaging device with a screen of its own. What you send here appears on that screen, and its replies come back here.';

  // What it looks like at the other end. 4:1, because the panel is.
  function panel() { return '<div class="pix panel" aria-hidden="true"><span class="t">Dot Dash</span><span class="m">Hello</span></div>'; }

  // The reassurance, above the action rather than in pale grey beneath it.
  function facts() {
    return '<div class="facts">' +
      '<div><b>No account, no password.</b> There is nothing to sign up for.</div>' +
      '<div><b>This link is yours alone.</b> It works on one device, so connect on the phone or computer you want to use.</div>' +
      '<div><b>You can leave whenever you like.</b> Nothing more reaches this device after that.</div>' +
      '</div>';
  }
  function legal() { return '<div class="links"><a href="/privacy.html">Privacy</a>·<a href="/terms.html">Terms</a></div>'; }
  function linkUrl(token) { return location.origin + '/c/' + token; }

  // The iOS app, offered to someone who was sent a link and is reading this on
  // a phone. Matches the account holder's landing page in the parent app, and
  // leads to instructions rather than the beta link itself: a TestFlight link
  // opened without TestFlight installed reads as the app being unavailable.
  // Replace both of these with the App Store listing once the app ships.
  var TESTFLIGHT_JOIN_URL = 'https://testflight.apple.com/join/NxFDSV39';

  }
  function iosBlock() { return '<div class="ios"><p>On an iPhone?</p><button id="iosb">' + badgeSvg() + '</button></div>'; }
  function wireIosBlock(back) { var b = document.getElementById('iosb'); if (b) b.onclick = function () { screenIos(back); }; }
  function screenIos(back) {
    view = 'other';
    show('<div class="center">' + logo() + '<h1>Get the iOS app</h1>' +
      '<p>The Dot Dash app is in beta, so it is installed through Apple\'s TestFlight app rather than the App Store.</p>' +
      '<div class="steps">' +
        '<div><span class="n">1</span><p>Download <b>"TestFlight"</b> from the App Store.</p></div>' +
        '<div><span class="n">2</span><p>Afterwards, tap the link below to download the beta iOS app.</p></div>' +
      '</div>' +
      '<a class="btn" style="margin-top:18px;text-decoration:none" href="' + TESTFLIGHT_JOIN_URL + '" target="_blank" rel="noopener noreferrer">Download the beta iOS app</a>' +
      '<p class="url">' + TESTFLIGHT_JOIN_URL + '</p>' +
      '<button class="btn ghost" id="iosback" style="margin-top:14px">Back</button>' +
      '</div>' + legal());
    document.getElementById('iosback').onclick = back;
  }

  // A copy of lib.toDeviceText, so the page can show what the Dot Dash will
  // actually display before anyone presses Send. The server's is the real one.
  var FOLD = { '‘': "'", '’': "'", '“': '"', '”': '"', '–': '-', '—': '-', '…': '...',
               ',': ' ', '\n': ' ', '\r': ' ', '\t': ' ', '|': '/', '<': '(', '>': ')', '[': '(', ']': ')', '{': '(', '}': ')', '%': ' PERCENT', '*': ' ' };
  var OK = /[A-Z0-9 .:?'\-/()"=+@!;_$&]/;
  function deviceText(s) {
    var out = '', chars = Array.from(String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, ''));
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i], up = ch.toUpperCase();
      if (FOLD[ch] !== undefined) out += FOLD[ch]; else if (up.length === 1 && OK.test(up)) out += up;
    }
    out = out.replace(/\s+/g, ' ').trim();
    if (!out && String(s || '').trim()) out = '(EMOJI)';
    return out;
  }

  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function standalone() { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; }
  // On iPhone a Home Screen web app is, to the server, a different device from
  // Safari -- and the only place notifications work.
  function iosSafari() { return isIOS() && !standalone(); }

  // SMS notifications are offered only once the bridge really sends them
  // (config.sms is false in DRY_RUN and sandbox mode). ?sms=1 shows them anyway
  // for testers, and sticks on this device until ?sms=0. In sandbox mode every
  // SMS lands on the sandbox phone page (/sms-sandbox.html), not on a phone.
  var PREVIEW = 'dotdash_sms_preview';
  if (/[?&]sms=1\b/.test(location.search)) { try { localStorage.setItem(PREVIEW, '1'); } catch (e) {} }
  if (/[?&]sms=0\b/.test(location.search)) { try { localStorage.removeItem(PREVIEW); } catch (e) {} }
  var preview = (function () { try { return localStorage.getItem(PREVIEW) === '1'; } catch (e) { return false; } })();
  var smsOn = preview, sandboxMode = false;
  function testBanner() {
    if (!preview || !sandboxMode || document.getElementById('sbx')) return;
    var b = document.createElement('div');
    b.id = 'sbx';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sunken);color:var(--warn);border-top:1px solid var(--rule);font-size:13px;text-align:center;padding:6px 10px';
    b.innerHTML = 'Test mode: SMS messages go to the <a href="/sms-sandbox.html" style="color:inherit">sandbox phone</a>, not to a real phone. <a href="?sms=0" style="color:inherit">Turn off</a>';
    document.body.appendChild(b);
  }

  // ------------------------------------------------------------------- boot --
  var parts = location.pathname.replace(/^\/c\/?/, '').split('.');
  var pToken = TOKEN_RE.test(parts[0] || '') ? parts[0] : null;
  var pClaim = TOKEN_RE.test(parts[1] || '') ? parts[1] : null;
  var hashChat = (location.hash.match(/chat=([A-Za-z0-9]{1,40})/) || [])[1];

  listenForNotificationTaps();
  // A #chat=<id> address while the page is already open (no reload happens).
  window.addEventListener('hashchange', function () {
    var id = (location.hash.match(/chat=([A-Za-z0-9]{1,40})/) || [])[1], c = id && byId(id);
    if (c && c.claim) openChat(c.token);
  });
  var ready = call('GET', 'config').then(function (cfg) { smsOn = preview || !!cfg.sms; sandboxMode = !!cfg.sandbox; testBanner(); }).catch(function () {});
  ready.then(boot);
  function boot() {
  if (pToken) {
    var e = byToken(pToken);
    // An address carrying a claim (a Home Screen app saved before this page
    // kept chats in storage) is adopted; a wrong one is caught by staleClaim.
    if (pClaim && (!e || e.claim !== pClaim)) e = upsert({ token: pToken, claim: pClaim });
    if (e && e.claim) openChat(pToken); else openLink(pToken);
  } else if (hashChat && byId(hashChat)) {
    openChat(byId(hashChat).token);
  } else {
    home();
  }
  live().forEach(function (c) { startPoll(c.token); });
  }
  document.addEventListener('visibilitychange', function () {
    // Re-ask with the new on-screen state straight away (the abort restarts the loop).
    for (var t in aborts) if (aborts[t]) { try { aborts[t].abort(); } catch (e) {} }
    if (!document.hidden) live().forEach(function (c) { startPoll(c.token); });
  });

  function home() {
    var l = chats.filter(function (c) { return c.claim; });
    if (!l.length) return screenNoLink();
    if (l.length === 1 && !l[0].ended) return openChat(l[0].token);
    inbox();
  }

  // ------------------------------------------------------- joining a chat --
  function openLink(token) {
    view = 'other'; current = null;
    call('POST', 'open', { token: token }).then(function (r) {
      if (r._status === 410) return screenGone(false);
      if (r._status !== 200) return screenError();
      if (r.state === 'claimed') return screenClaimed();
      screenLanding(r, token);
    }).catch(screenError);
  }

  // then(c) runs once claimed; without it the chat opens.
  function claim(token, info, then) {
    return call('POST', 'claim', { token: token }).then(function (r) {
      if (r._status === 200) {
        var c = upsert({ token: token, claim: r.claim, id: r.id, displayName: r.displayName, contactName: r.contactName, notify: r.notify, ended: false });
        startPoll(token);
        if (then) return then(c);
        openChat(token);
        setupPush(false);
      } else if (r._status === 409) screenClaimed();
      else if (r._status === 410) screenGone(false);
      else screenError();
    }).catch(screenError);
  }

  // A new link: the opt-in screen comes first. Either button connects (claims)
  // the link; Continue also turns on SMS notifications, which sends the setup
  // message, then the chat opens.
  function screenLanding(info, token) {
    history.replaceState(null, '', '/c/' + token);
    // The order is the brief's, section 8: who invited you, then what a Dot
    // Dash is in one sentence, then a picture of it, then the reassurance,
    // then the action. A stranger has arrived from a message they did not
    // expect, and has to be able to answer "what is this" before "shall I".
    var who = '<h1>Hi ' + esc(info.contactName) + '!</h1>' +
      '<p style="color:var(--ink)">You\'ve been invited to message <b>' + esc(info.displayName) + '</b>.</p>' +
      '<p>' + WHAT_IT_IS + '</p>' + panel();
    if (!smsOn) {
      show('<div class="center">' + logo() + who + facts() +
        '<button class="btn" id="go">Connect</button></div>' + legal());
      document.getElementById('go').onclick = function () { this.disabled = true; claim(token, info); };
      return;
    }
    // With SMS on, the reassurance goes ABOVE the opt-in card: this branch is
    // about to ask for a phone number, which is the moment it is most needed.
    screenOptIn({
      intro: who + facts(),
      displayName: info.displayName,
      skipLabel: 'Skip, just open the chat',
      chat: function () { return byToken(token); },
      connect: function (then) { return claim(token, info, then); },
    });
  }

  // The SMS opt-in form, for a new link (screenLanding) or from a chat's
  // "SMS notifications" link. The consent box starts unticked and Continue
  // stays off until it is ticked: consent has to be the contact's own act.
  function screenOptIn(o) {
    view = 'other'; current = null;
    var c0 = o.chat && o.chat(), on = c0 && c0.notify && c0.notify.status;
    show('<div class="center">' + logo() + (o.intro || '') +
      '<div class="optin">' +
        (on === 'active' ? '<h2>SMS notifications are on</h2><p class="small">We\'ll send a message to ' + esc(c0.notify.hint) + ' when you have a new message. You can turn this off at any time, or reply STOP to any of them.</p>' +
          '<button class="btn ghost" id="off">Turn off SMS notifications</button>'
        : (on === 'stopped' ? '<p class="small"><b>Your phone has stopped messages from Dot Dash.</b> To turn them back on, send START to the number they came from, or enter your number again below.</p>' : '') +
          '<h2>Get a message on your phone when ' + esc(o.displayName) + ' writes to you</h2>' +
          '<input class="field" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Your mobile number">' +
          '<label class="consent"><input type="checkbox" id="agree"><span><b>Yes, send me SMS notifications from Dot Dash</b> when I have a new message. Each one links back to this chat; message frequency varies. Msg &amp; data rates may apply. Reply HELP for help, STOP to cancel. See our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</span></label>' +
          '<div class="err" id="err"></div>' +
          '<button class="btn" id="on" disabled>Continue</button>') +
      '</div>' +
      '<button class="btn ghost" id="skip">' + esc(on === 'active' ? 'Back to the chat' : o.skipLabel) + '</button>' +
      (o.foot || '') + '</div>' + legal());

    var phone = document.getElementById('phone'), agree = document.getElementById('agree'), go = document.getElementById('on'), err = document.getElementById('err');
    function ready() { go.disabled = !(agree.checked && phone.value.replace(/\D/g, '').length >= 10); }
    if (phone) { phone.oninput = ready; agree.onchange = ready; }

    // Connects first when this is a new link, then hands over the chat.
    function withChat(fn) {
      var c = o.chat && o.chat();
      if (c && c.claim) return fn(c);
      return o.connect(fn);
    }
    if (go) go.onclick = function () {
      go.disabled = true; err.textContent = '';
      withChat(function (c) {
        return call('POST', 'notify', { phone: phone.value, consent: true }, authOf(c)).then(function (r) {
          if (r._status === 200) {
            upsert({ token: c.token, notify: r.notify });
            // This phone sent STOP to us before: the form now says how to undo it.
            if (r.notify.status === 'stopped') return screenOptIn(o);
            openChat(c.token, 'SMS notifications are on. We just sent a message to ' + r.notify.hint + '.');
          } else {
            err.textContent = r.status === 'invalid-number' ? 'That doesn\'t look like a US mobile number. Check it and try again.'
              : r._status === 429 ? 'Too many tries today. You can turn this on later from the chat.'
              : 'Couldn\'t turn on notifications. Check your connection and try again.';
            ready();
          }
        });
      }).catch(function () { err.textContent = 'Couldn\'t connect. Check your connection and try again.'; ready(); });
    };
    var off = document.getElementById('off');
    if (off) off.onclick = function () {
      off.disabled = true;
      var c = o.chat();
      call('DELETE', 'notify', null, authOf(c)).then(function (r) {
        if (r._status === 200) upsert({ token: c.token, notify: r.notify });
        openChat(c.token, r._status === 200 ? 'SMS notifications are off, and your number has been deleted.' : null);
      });
    };
    document.getElementById('skip').onclick = function () {
      this.disabled = true;
      withChat(function (c) {
        // Remembered on the server, so the opt-in isn't shown again on this chat.
        if (!(c.notify && c.notify.asked)) call('POST', 'notify', { skip: true }, authOf(c)).then(function (r) { if (r._status === 200) upsert({ token: c.token, notify: r.notify }); });
        openChat(c.token);
        setupPush(false);
      }).catch(screenError);
    };
  }

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(function () { prompt('Copy this link:', t); });
    prompt('Copy this link:', t);
    return Promise.resolve();
  }

  // Paste a link you were sent into this app -- how a second chat reaches an
  // existing iPhone Home Screen app, since links themselves open in Safari.
  function screenAddChat() {
    view = 'other'; current = null;
    var canPaste = !!(navigator.clipboard && navigator.clipboard.readText);
    show('<header>' + (live().length ? '<button class="hbtn back" id="back" aria-label="Back">‹</button>' : '') + '<div class="who">Add a chat</div></header>' +
      '<div class="center" style="justify-content:flex-start;text-align:left">' +
      '<p>Paste the Dot Dash link you were sent.</p>' +
      '<input class="field" id="link" placeholder="https://dotdashdevice.com/c/…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      (canPaste ? '<button class="btn ghost" id="paste" style="margin-bottom:10px">Paste</button>' : '') +
      '<button class="btn" id="add">Connect</button><p class="small" id="msg" style="margin-top:10px"></p></div>');
    var field = document.getElementById('link'), note = document.getElementById('msg');
    if (document.getElementById('back')) document.getElementById('back').onclick = home;
    if (canPaste) document.getElementById('paste').onclick = function () {
      navigator.clipboard.readText().then(function (t) { field.value = t.trim(); }).catch(function () { note.textContent = 'Couldn\'t paste. Press and hold in the box, then tap Paste.'; });
    };
    document.getElementById('add').onclick = function () {
      var m = /(?:\/c\/)?([A-Za-z0-9_-]{32})(?:[.#?/]|$)/.exec(field.value.trim());
      if (!m) { note.textContent = 'That doesn\'t look like a Dot Dash link.'; return; }
      var token = m[1];
      if (byToken(token) && byToken(token).claim) return openChat(token);
      this.disabled = true;
      var btn = this;
      call('POST', 'open', { token: token }).then(function (r) {
        btn.disabled = false;
        if (r._status === 410) note.textContent = 'That link has expired. Ask for a new one.';
        else if (r.state === 'claimed') note.textContent = 'That link is already connected on another device. If that was Safari, open it there and tap "Move this chat to my Home Screen", or ask for a new link.';
        else if (r._status === 200) claim(token, r);
        else note.textContent = 'Couldn\'t connect. Check your connection and try again.';
      }).catch(function () { btn.disabled = false; note.textContent = 'Couldn\'t connect. Check your connection and try again.'; });
    };
  }

  // ---------------------------------------------------------- other screens --
  function screenClaimed() {
    view = 'other';
    show('<div class="center">' + logo() + '<h1>Already connected on another device</h1>' +
      '<p>Each link works on one device. To use this one instead, ask whoever sent you the link for a new one.</p>' + backToChats() + '</div>' + legal());
    wireBackToChats();
  }
  function screenGone(left) {
    view = 'other';
    show('<div class="center">' + logo() + '<h1>' + (left ? 'You\'ve left the chat' : 'This link has expired') + '</h1>' +
      '<p>' + (left ? 'Nothing more will reach this device. To message again, ask for a new link.'
                    : 'It may have been replaced with a new one, or the chat was ended. Ask whoever sent it for a new link.') + '</p>' + backToChats() + '</div>' + legal());
    wireBackToChats();
  }
  function screenNoLink() {
    view = 'other';
    show('<div class="center">' + logo() + '<h1>Open your Dot Dash link</h1><p>Use the link you were sent to start chatting.</p>' +
      '<button class="btn ghost" id="addc">Paste a link</button>' + iosBlock() + '</div>' + legal());
    document.getElementById('addc').onclick = screenAddChat;
    wireIosBlock(screenNoLink);
  }
  function screenError() {
    view = 'other';
    show('<div class="center">' + logo() + '<h1>Can\'t connect right now</h1><p>Check your connection and try again.</p>' +
      '<button class="btn ghost" onclick="location.reload()">Try again</button></div>');
  }
  function backToChats() { return live().length ? '<button class="btn ghost" id="toChats" style="margin-top:14px">Back to your chats</button>' : ''; }
  function wireBackToChats() { var b = document.getElementById('toChats'); if (b) b.onclick = home; }

  // ------------------------------------------------------------------ inbox --
  function inbox() {
    view = 'inbox'; current = null;
    history.replaceState(null, '', '/c/');
    document.title = 'Dot Dash';
    var rows = chats.filter(function (c) { return c.claim; }).sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); });
    show('<header>' + mark(24, 'mark') + '<div class="who">Dot Dash</div><button class="hbtn" id="addc">+ Add a chat</button></header>' +
      '<div class="list">' + rows.map(function (c) {
        var last = c.ended ? 'This chat has ended' : c.lastText ? (c.lastFrom === 'contact' ? 'You: ' : '') + c.lastText : 'No messages yet';
        return '<button class="chatrow" data-t="' + esc(c.token) + '">' + mark(24, 'mark') +
          '<span class="mid"><span class="name" style="display:block">' + esc(c.displayName || 'Dot Dash') + '</span><span class="last" style="display:block">' + esc(last) + '</span></span>' +
          (c.lastAt ? '<span class="time">' + esc(when(c.lastAt)) + '</span>' : '') + (unread(c) ? '<span class="dot" aria-label="New"></span>' : '') + '</button>';
      }).join('') + '</div><div id="pushArea"></div>' + legal());
    document.getElementById('addc').onclick = screenAddChat;
    Array.prototype.forEach.call(document.querySelectorAll('.chatrow'), function (b) {
      b.onclick = function () {
        var c = byToken(b.getAttribute('data-t'));
        if (c && c.ended) { drop(c.token); current = c.token; return screenGone(false); }
        openChat(b.getAttribute('data-t'));
      };
    });
    setupPush(false);
  }
  function unread(c) { return !c.ended && c.lastFrom === 'dotdash' && (c.lastAt || 0) > (c.readAt || 0); }
  function when(at) {
    var d = new Date(at), now = new Date();
    return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  // ------------------------------------------------------------------- chat --
  var lastShown = 0, shownKeys = {};

  function openChat(token, note) {
    var c = byToken(token);
    if (!c || !c.claim) return openLink(token);
    view = 'chat'; current = token;
    history.replaceState(null, '', '/c/' + authOf(c));
    renderChat(c);
    if (note) pushArea('<div class="notice">' + esc(note) + '</div>');
    if (msgs[token]) { msgs[token].forEach(addBubble); scrollDown(); markRead(c); }
    loadHistory(token).then(function (ok) {
      if (!ok || current !== token) return;
      var cc = byToken(token);
      // A chat connected before SMS notifications existed: offer them once.
      if (smsOn && cc.notify && !cc.notify.asked) return screenNotify(token);
      document.querySelector('header .who').textContent = cc.displayName;
      (msgs[token] || []).forEach(addBubble);
      scrollDown(); markRead(cc);
    });
    setupPush(false);
  }

  // Resolves true once msgs[token] holds the chat's history.
  function loadHistory(token) {
    var c = byToken(token);
    return call('GET', 'history', null, authOf(c)).then(function (r) {
      if (r._status === 403) { staleClaim(token); return false; }
      if (r._status === 410 || r._status === 401) { ended(token); return false; }
      if (r._status !== 200) return false;
      msgs[token] = r.messages || [];
      upsert({ token: token, id: r.id, displayName: r.displayName, contactName: r.contactName, notify: r.notify });
      noteLast(token);
      return true;
    }).catch(function () { return false; });
  }

  function noteLast(token) {
    var list = msgs[token] || [], m = list[list.length - 1];
    if (m) upsert({ token: token, lastAt: m.at, lastText: m.text, lastFrom: m.from });
  }
  function markRead(c) { if (c && c.lastAt && c.readAt !== c.lastAt) upsert({ token: c.token, readAt: c.lastAt }); }

  function renderChat(c) {
    lastShown = 0; shownKeys = {};
    document.title = (c.displayName || 'Dot Dash') + ' · Dot Dash';
    var many = chats.filter(function (x) { return x.claim; }).length > 1;
    show('<header>' + (many ? '<button class="hbtn back" id="back" aria-label="All chats">‹</button>' : '') +
      mark(24, 'mark') + '<div class="who">' + esc(c.displayName || '') + '</div><button class="hbtn" id="addc">+ Add</button></header>' +
      '<div id="log"><div class="empty" id="empty">Say hello! Your messages appear on ' + esc(c.displayName || 'the Dot Dash') + '\'s screen.</div></div>' +
      '<div id="pushArea"></div>' +
      '<footer class="compose"><div class="row"><textarea id="msg" rows="1" maxlength="400" placeholder="Message"></textarea>' +
      '<button class="btn send" id="send">Send</button></div><div class="preview" id="preview"></div>' +
      '<div class="links">' + (smsOn ? '<button id="sms">SMS notifications</button>·' : '') + '<a href="/privacy.html">Privacy</a>·<button id="leave">Leave this chat</button></div></footer>');
    if (many) document.getElementById('back').onclick = inbox;
    if (smsOn) document.getElementById('sms').onclick = function () { screenNotify(c.token); };
    document.getElementById('addc').onclick = screenAddChat;
    var box = document.getElementById('msg');
    box.oninput = function () {
      box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 120) + 'px';
      var raw = box.value, d = deviceText(raw), pv = document.getElementById('preview');
      if (!raw.trim()) { pv.innerHTML = ''; return; }
      // Shown as the panel itself rather than as a line of grey text: this is
      // a picture of what the Dot Dash will display, so it is set in the pixel
      // face on the unlit panel colour. Wrapped, never cut.
      var note = d.length > MAX ? '<span class="warn">Too long — it will be cut to ' + MAX + ' letters.</span>' : '';
      pv.innerHTML = (d === raw.trim() ? '' : 'On the Dot Dash:<span class="pix">' + esc(d.slice(0, MAX)) + '</span>') + note;
    };
    box.onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); sendMsg(); } };
    document.getElementById('send').onclick = sendMsg;
    document.getElementById('leave').onclick = function () {
      if (!confirm('Leave this chat? ' + c.displayName + ' won\'t be able to message you, and this link will stop working.')) return;
      var t = c.token;
      leaving[t] = true;
      call('POST', 'leave', null, authOf(c)).then(function () {
        drop(t);
        if (!live().length) unsubscribePush();
        screenGone(true);
      });
    };
  }

  // The opt-in form for a chat that is already connected.
  function screenNotify(token) {
    var c = byToken(token);
    screenOptIn({
      displayName: c.displayName,
      skipLabel: 'Not now',
      chat: function () { return byToken(token); },
      connect: function () { return Promise.reject(new Error('not connected')); },
    });
  }

  function key(m) { return m.at + '|' + m.from + '|' + m.text; }
  function addBubble(m) {
    if (shownKeys[key(m)]) return;
    shownKeys[key(m)] = 1;
    var log = document.getElementById('log'); if (!log) return;
    var e = document.getElementById('empty'); if (e) e.remove();
    if (m.at - lastShown > 30 * 60e3) {
      var w = document.createElement('div'); w.className = 'when';
      w.textContent = new Date(m.at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
      log.appendChild(w);
    }
    var b = document.createElement('div');
    b.className = 'b ' + (m.from === 'contact' ? 'me' : 'them');
    b.textContent = m.text;
    log.appendChild(b);
    lastShown = Math.max(lastShown, m.at);
  }
  function scrollDown() { window.scrollTo(0, document.body.scrollHeight); }

  function received(token, list) {
    if (!list.length) return;
    var have = msgs[token] || (msgs[token] = []), seen = {};
    have.forEach(function (m) { seen[key(m)] = 1; });
    list.forEach(function (m) { if (!seen[key(m)]) have.push(m); });
    have.sort(function (a, b) { return a.at - b.at; });
    noteLast(token);
    if (view === 'chat' && current === token) { list.forEach(addBubble); scrollDown(); if (!document.hidden) markRead(byToken(token)); }
    else if (view === 'inbox') inbox();
  }

  function sendMsg() {
    var c = byToken(current); if (!c) return;
    var box = document.getElementById('msg'), btn = document.getElementById('send');
    var raw = box.value; if (!raw.trim()) return;
    btn.disabled = true;
    call('POST', 'send', { text: raw }, authOf(c)).then(function (r) {
      btn.disabled = false;
      if (r._status === 200) { box.value = ''; box.oninput(); received(c.token, [r.message]); }
      else if (r._status === 429) alert('That\'s a lot of messages at once. Wait a minute and try again.');
      else if (r._status === 410) ended(c.token);
      else if (r._status === 403) staleClaim(c.token);
      else if (r.status !== 'empty') alert('Couldn\'t send. Check your connection and try again.');
    }).catch(function () { btn.disabled = false; alert('Couldn\'t send. Check your connection and try again.'); });
  }

  // One long poll per connected chat: the server answers when something new
  // arrives, or after ~25s. Background chats keep the inbox's unread dots true.
  function startPoll(token) {
    if (polls[token]) return;
    polls[token] = true;
    var first = msgs[token] ? Promise.resolve(true) : loadHistory(token);
    first.then(function (ok) {
      if (!ok) { polls[token] = false; return; }
      if (view === 'inbox') inbox();
      (function loop() {
        var c = byToken(token);
        if (!c || !polls[token] || leaving[token]) { polls[token] = false; return; }
        var after = (msgs[token] || []).reduce(function (a, m) { return Math.max(a, m.at); }, 0);
        // v=1 tells the bridge the page is on screen, so it holds back the SMS
        // notification. Hidden, the wait is dropped at once and resumed as v=0
        // (see onVisibility), so leaving the chat lets the next one through.
        var ac = window.AbortController ? new AbortController() : null;
        aborts[token] = ac;
        call('GET', 'wait?after=' + after + '&v=' + (document.hidden ? 0 : 1), null, authOf(c), ac && ac.signal).then(function (r) {
          if (leaving[token]) { polls[token] = false; return; }
          if (r._status === 410) { polls[token] = false; return ended(token); }
          if (r._status === 403) { polls[token] = false; return staleClaim(token); }
          received(token, r.messages || []);
          setTimeout(loop, r._status === 200 ? 0 : 5000);
        }).catch(function (e) { setTimeout(loop, e && e.name === 'AbortError' ? 0 : 5000); });
      })();
    });
  }

  // The chat was ended: replaced with a new link, removed, or left elsewhere.
  function ended(token) {
    if (leaving[token]) return;
    if (current === token) { drop(token); return screenGone(false); }
    var c = byToken(token);
    if (c) { upsert({ token: token, ended: true }); polls[token] = false; }
    if (view === 'inbox') inbox();
  }

  // Our claim no longer matches: another device took the link, or this claim
  // is out of date because the link was released (moved to the Home Screen).
  // If it is free again, offer Connect rather than a dead end.
  function staleClaim(token) {
    if (leaving[token]) return;
    var c = byToken(token);
    if (c) { c.claim = null; persist(); }
    polls[token] = false;
    if (current === token) openLink(token);
    else if (view === 'inbox') inbox();
  }

  // ------------------------------------------------------------------- push --
  function pushCapable() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function pushArea(html) { var a = document.getElementById('pushArea'); if (a) a.innerHTML = html; return a; }

  function setupPush(ask) {
    // SMS notifications cover it: no browser-push prompt on top.
    var cur = byToken(current);
    if (view === 'chat' && cur && cur.notify && cur.notify.status === 'active') return;
    if (iosSafari()) {
      // Browser push on iPhone needs the Home Screen; SMS doesn't.
      if (view === 'chat' && smsOn) {
        if (document.getElementById('pushArea') && document.getElementById('pushArea').innerHTML) return;   // a note is showing
        pushArea('<div class="notice"><b>Want to know when ' + esc((cur || {}).displayName) + ' replies?</b> <button class="btn" style="margin-top:8px" id="smsOn">Get SMS notifications</button></div>');
        document.getElementById('smsOn').onclick = function () { screenNotify(current); };
      } else pushArea('');
      return;
    }
    if (!pushCapable() || !live().length) return pushArea('');
    if (Notification.permission === 'denied') return pushArea('<div class="notice small">Notifications are blocked for this site. You can turn them on in your browser settings.</div>');
    navigator.serviceWorker.register('/c/sw.js', { scope: '/c/' }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (sub) {
        if (sub) return sendSubAll(sub).then(function () { pushArea(''); });
        if (Notification.permission === 'granted' || ask) return subscribe(reg);
        pushArea('<div class="notice"><b>Get a notification when a Dot Dash replies.</b> <button class="btn" style="margin-top:8px" id="pushOn">Turn on notifications</button></div>');
        document.getElementById('pushOn').onclick = function () { setupPush(true); };
      });
    }).catch(function () { pushArea(''); });
  }

  function subscribe(reg) {
    return call('GET', 'config').then(function (cfg) {
      if (!cfg.vapidPublicKey) return pushArea('');
      return Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') return setupPush(false);
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(cfg.vapidPublicKey) })
          .then(sendSubAll).then(function () { pushArea(''); });
      });
    });
  }
  // One browser subscription serves every chat on this device: each chat's
  // pairing is told the same address, and each notification says which chat.
  function sendSubAll(sub) {
    var json = sub.toJSON();
    return Promise.all(live().map(function (c) { return call('POST', 'push', { subscription: json }, authOf(c)); }));
  }
  function unsubscribePush() {
    if (!pushCapable()) return;
    navigator.serviceWorker.getRegistration('/c/').then(function (reg) {
      if (reg) reg.pushManager.getSubscription().then(function (s) { if (s) s.unsubscribe(); });
    });
  }
  function b64(s) {
    var p = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, function (c) { return c.charCodeAt(0); });
  }

  // A tapped notification, with this page already open: the service worker
  // says which chat; open it.
  function listenForNotificationTaps() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.addEventListener('message', function (e) {
      var id = e.data && e.data.openChat, c = id && byId(id);
      if (c && c.claim) openChat(c.token);
    });
  }
})();
</script>
</body>
</html>
