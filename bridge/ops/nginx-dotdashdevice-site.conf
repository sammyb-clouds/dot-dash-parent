# Public site for dotdashdevice.com (the home page Twilio's toll-free reviewers
# read, plus the privacy policy and terms). Static files from site/ and legal/
# in the dot-dash-parent repo, copied by hand to /var/www/dotdashdevice.
# Also serves the link contacts' chat page (/c/) and proxies its API (/chat/api/).
# Installed as /etc/nginx/sites-available/dotdashdevice-site. certbot --nginx
# adds the 443 block once DNS for the domain points at this droplet.
server {
    server_name dotdashdevice.com www.dotdashdevice.com;

    root /var/www/dotdashdevice;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Revalidate pages so an edited policy is seen at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Link contacts' chat page (site/c/). Every /c/<link> path serves the one
    # page. The link token in the path is a credential: never logged, never
    # sent on as a referrer. ^~ keeps the .html rule above from taking over.
    location ^~ /c/ {
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /c/index.html;
    }

    # Universal Links: Apple fetches this to let the iOS app open /c/ links.
    # Must be served as JSON, with no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "max-age=3600";
    }

    location = /c/manifest.webmanifest {
        access_log off;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The chat page's API -- bridge/sms.mjs on 127.0.0.1:8791 (chatApi).
    # A long poll holds a request open for ~25s.
    location ^~ /chat/api/ {
        access_log off;
        client_max_body_size 8k;
        proxy_read_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8791;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dotdashdevice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dotdashdevice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.dotdashdevice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dotdashdevice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dotdashdevice.com www.dotdashdevice.com;
    return 404; # managed by Certbot




}