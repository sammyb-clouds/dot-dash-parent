# Rate limit for device key enrollment (location /enroll in sites-available/dotdash).
# A device enrolls once and retries rarely; a burst from one address is not a device.
limit_req_zone $binary_remote_addr zone=enroll:1m rate=10r/m;

# Rate limit for app logins (location /app-login). An app asks when it opens and
# after pairing changes; a burst from one address is not a family.
limit_req_zone $binary_remote_addr zone=applogin:1m rate=30r/m;

# Rate limit for the SMS bridge's parent endpoints (location /sms/contacts).
# Adding and removing contacts is rare; the bridge has its own per-parent caps.
limit_req_zone $binary_remote_addr zone=smscontacts:1m rate=20r/m;
