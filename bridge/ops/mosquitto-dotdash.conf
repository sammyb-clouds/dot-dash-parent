# Authentication and ACLs are set per listener, so a listener added later can
# run different login rules without touching these. Every listener below MUST
# state its own allow_anonymous, password_file and acl_file: with
# per_listener_settings on, a listener that omits them has none.
per_listener_settings true

# --- Physical ESP32 Devices (Port 8883) ---
listener 8883
certfile /etc/letsencrypt/live/app.dotdashdevice.com/cert.pem
cafile /etc/letsencrypt/live/app.dotdashdevice.com/chain.pem
keyfile /etc/letsencrypt/live/app.dotdashdevice.com/privkey.pem
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

# --- Parent Web App WebSockets (Port 8884) ---
listener 8884
protocol websockets
certfile /etc/letsencrypt/live/app.dotdashdevice.com/cert.pem
cafile /etc/letsencrypt/live/app.dotdashdevice.com/chain.pem
keyfile /etc/letsencrypt/live/app.dotdashdevice.com/privkey.pem
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

# --- Per-device keys (Port 8885) ---
# Each device logs in with its own key and can reach only its own mailboxes;
# keys live in the dynamic security plugin, managed with the scripts in
# /root/dotdash_dynsec. Nothing here affects 8883 or 8884.
listener 8885
certfile /etc/letsencrypt/live/app.dotdashdevice.com/cert.pem
cafile /etc/letsencrypt/live/app.dotdashdevice.com/chain.pem
keyfile /etc/letsencrypt/live/app.dotdashdevice.com/privkey.pem
allow_anonymous false
plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# --- Parent app, per-account logins (Port 8886) ---
# A parent's own login, issued by /app-login (bridge/enroll.mjs) after it
# verifies their Firebase token; it reaches only that parent's devices. Replaces
# the shared dotdash-app password on 8884 once every app has moved.
#
# SAME plugin file as 8885, deliberately. mosquitto 2.0.18 loads the plugin once
# per listener but the copies share one store: a login made through either
# listener works on both, and deletes and password changes apply to both
# (tested 2026-09-15 on a throwaway broker, including across a restart). Two
# DIFFERENT files would be merged into that one store and both saved over.
listener 8886
protocol websockets
certfile /etc/letsencrypt/live/app.dotdashdevice.com/cert.pem
cafile /etc/letsencrypt/live/app.dotdashdevice.com/chain.pem
keyfile /etc/letsencrypt/live/app.dotdashdevice.com/privkey.pem
allow_anonymous false
plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json
