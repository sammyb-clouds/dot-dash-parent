# Paste INSIDE the existing 443 server block for app.dotdashdevice.com, in
# /etc/nginx/sites-available/dotdash.
#
# `^~` matters. That vhost has regex locations (`~* \.html$` and the
# service-worker/manifest rules); a plain prefix location would lose to them and
# the dashboard's own index.html would be served by the static rules instead of
# the proxy. `^~` beats a regex, so this wins.
location ^~ /ops/ {
    auth_basic           "Dot Dash ops";
    auth_basic_user_file /etc/nginx/dotdash-ops.htpasswd;

    proxy_pass         http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 30s;

    # An ops page is never a thing to cache, and never a thing to index.
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}
